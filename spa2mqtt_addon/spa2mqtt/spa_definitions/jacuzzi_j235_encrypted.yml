    - name: temperature_increment
      type: button
      home_assistant:
        name: Temperature Increment
      action:
        method: queue_button_command
        args:
          button: 225
    - name: temperature_decrement
      type: button
      home_assistant:
        name: Temperature Decrement
      action:
        method: queue_button_command
        args:
          button: 226
    - name: pump_1_button
      type: button
      home_assistant:
        name: Pump 1 Button
      action:
        method: queue_button_command
        args:
          button: 228
    - name: pump_2_button
      type: button
      home_assistant:
        name: Pump 2 Button
      action:
        method: queue_button_command
        args:
          button: 229
    - name: temperature_set_control
      type: number
      home_assistant:
        name: Temperature Set Control
        min: 20
        max: 40
        step: 0.5
        mode: slider
      action:
        method: set_command_temperature
      value:
        from: setpoint_temperature
        stability_period: 3
