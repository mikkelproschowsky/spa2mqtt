family: jacuzzi_encrypted
communicator: JacuzziEncryptedCommunicator
spa: JacuzziEncryptedSpa
model_name: Jacuzzi J235
serial_number: Not Set
sensor_update_intervals:
  default: 60
  overrides:
    secondary_pump_status: 90
    circulation_pump_status: 90
message_configuration:
  0xc4:
    - name: current_temperature
      home_assistant:
        name: Current Water Temperature
        icon: mdi:coolant-temperature
        unit_of_measurement: "°C"
        device_class: temperature
      offset: 5
      length: 1
      xor: 0x02
      scale: 0.5  # This will vary if we're in F or C - if C, 0.5 else you can omit or set to 1
    - name: setpoint_temperature
      home_assistant:
        name: Target Water Temperature
        icon: mdi:target
        unit_of_measurement: "°C"
        device_class: temperature
      offset: 8
      scale: 0.5 # This will vary if we're in F or C - if C, 0.5 else you can omit or set to 1
    # Measured 2026-10-20 (button presses + bus capture, see CHANGELOG 1.0.4):
    #   byte 2 bit 3 = pump 1 low speed (circulation), byte 2 bit 4 = pump 1 high, byte 1 bit 2 = pump 2,
    #   byte 10 bit 6 = heater on (matches the Shelly on the heater phase). Byte 1 bit 6 blinks (panel LED) – not a pump.
    - name: pump_1_low
      offset: 2
      shift: 3
      mask: 1
    - name: pump_1_high
      offset: 2
      shift: 4
      mask: 1
    - name: pump_2
      offset: 1
      shift: 2
      mask: 1
    - name: heater
      offset: 10
      shift: 6
      mask: 1

